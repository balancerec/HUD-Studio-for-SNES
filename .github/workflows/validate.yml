name: Validate HUD Studio
on:
  push:
  pull_request:
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install asset-test dependencies
        run: python -m pip install Pillow numpy

      - name: Validate package and embedded JavaScript
        run: python tests/smoke-test.py

      - name: Hit-test regression tests
        run: node tests/hit-test.test.cjs

      - name: Multi-selection and group regression
        run: node tests/editor-v021.test.cjs

      - name: UI and clipboard regressions
        run: |
          node tests/ui-v022.test.cjs
          node tests/editor-v023.test.cjs

      - name: DynamicBar components and assets
        run: |
          python tests/dynamic-bar-assets.py
          node tests/dynamic-bars.test.cjs

      - name: Validate master sprite-sheet extraction
        run: python tests/master-assets.test.py

      - name: Verificar miolos quatro cores
        run: python tests/miolos-4-cores.test.py

      - name: Validate Fill Editor V0.2.7
        run: python tests/fill-editor-v027.test.py

      - name: Auto Trim Pro V0.3.5 (geometry and regression)
        run: |
          node tests/auto-trim-v034.test.cjs
          node tests/auto-trim-pro-v035.test.cjs

      - name: Precision and FX regressions
        run: |
          node tests/precision-v032.test.cjs
          node tests/precision-v032plus.test.cjs
          node tests/fx-fidelity-v033.test.cjs

      - name: Screen resolution presets (PC, SNES, Mobile)
        run: node tests/screen-presets-v0352.test.cjs

      - name: Adaptive layouts PC SNES Mobile regression
        run: node tests/adaptive-layout-v0353.test.cjs

      - name: Smoke GIF playback regression
        run: node tests/smoke-gif-playback-v0351.test.cjs

      - name: Viewport and manual layout profiles v0.3.5.4
        run: node tests/viewport-layout-v0354.test.cjs
